<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">EasyAgent 框架：默认实现、自定义实现与职责契约</title>
  <desc id="desc">默认实现和用户实现遵循各模块自己的契约，经 BasicAgent 的公开安装入口绑定。默认执行管线协调请求、模型、工具、事件与历史；会话操作显式发起，扩展能力按需安装。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#62788a"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b44}.h{font-size:27px;font-weight:700}.b{font-size:23px}.s{font-size:20px;fill:#53677e}.k{font-size:16px;font-weight:700;letter-spacing:2px}.line{fill:none;stroke:#62788a;stroke-width:2;marker-end:url(#a)}</style>
  </defs>
  <rect width="1440" height="1060" rx="24" fill="#f5f7fa"/>
  <text x="52" y="58" class="k">EASYAGENT / FRAMEWORK ARCHITECTURE</text>
  <text x="52" y="108" font-size="36" font-weight="700">默认实现可直接用，自定义实现沿同一契约接入</text>
  <rect x="52" y="154" width="645" height="136" rx="16" fill="white" stroke="#cbd8e4"/>
  <text x="80" y="198" class="h">框架提供的默认实现</text>
  <text x="80" y="237" class="s">SystemPromptComposer · ContextManager</text>
  <text x="80" y="268" class="s">内置工具 · LayeredMemory · SQLiteSessionStore</text>
  <rect x="743" y="154" width="645" height="136" rx="16" fill="#eaf6f4" stroke="#168883"/>
  <text x="771" y="198" class="h">用户提供的领域实现</text>
  <text x="771" y="237" class="s">产品规则 · 领域工具 · 证据型记忆</text>
  <text x="771" y="268" class="s">领域压缩策略 · 自己的会话数据库</text>
  <path d="M374 298V325H720V346" class="line"/>
  <path d="M1066 298V325H720V346" class="line"/>
  <text x="52" y="338" class="s">各职责自己的公开契约</text>
  <path d="M176 352H1264" fill="none" stroke="#62788a" stroke-width="2"/>
  <path d="M176 352V365" class="line"/><path d="M448 352V365" class="line"/>
  <path d="M720 346V365" class="line"/><path d="M992 352V365" class="line"/>
  <path d="M1264 352V365" class="line"/>
  <g fill="white" stroke="#a5cfc9">
    <rect x="52" y="369" width="248" height="95" rx="12"/>
    <rect x="324" y="369" width="248" height="95" rx="12"/>
    <rect x="596" y="369" width="248" height="95" rx="12"/>
    <rect x="868" y="369" width="248" height="95" rx="12"/>
    <rect x="1140" y="369" width="248" height="95" rx="12"/>
  </g>
  <text x="176" y="407" text-anchor="middle" class="b">Prompt Composer</text><text x="176" y="439" text-anchor="middle" class="s">build(context)</text>
  <text x="448" y="407" text-anchor="middle" class="b">Tool</text><text x="448" y="439" text-anchor="middle" class="s">run() / arun()</text>
  <text x="720" y="407" text-anchor="middle" class="b">BaseMemory</text><text x="720" y="439" text-anchor="middle" class="s">说明 / 工具 / Hook</text>
  <text x="992" y="407" text-anchor="middle" class="b">Context / Compactor</text><text x="992" y="439" text-anchor="middle" class="s">组装 / 预算 / 压缩</text>
  <text x="1264" y="407" text-anchor="middle" class="b">BaseSessionStore</text><text x="1264" y="439" text-anchor="middle" class="s">状态记录读写</text>
  <path d="M176 471V496" class="line"/><path d="M448 471V496" class="line"/>
  <path d="M720 471V496" class="line"/><path d="M992 471V496" class="line"/>
  <path d="M1264 471V496" class="line"/>
  <rect x="52" y="509" width="1336" height="112" rx="16" fill="#172b44"/>
  <text x="80" y="553" font-size="28" font-weight="700" style="fill:white">BasicAgent：公开装配入口</text>
  <text x="80" y="592" font-size="22" style="fill:#cfdee9">with_prompt · add_tool / with_tool · with_memory · with_context · with_session</text>
  <path d="M720 629V662" class="line"/>
  <rect x="52" y="675" width="1336" height="154" rx="16" fill="#eaf6f4" stroke="#168883" stroke-width="2"/>
  <text x="80" y="718" class="h">框架承接安装与协调</text>
  <text x="80" y="758" class="b">注册与服务绑定 · 请求准备 · 模型与工具调用 · 结果 / 历史 / 事件</text>
  <text x="80" y="798" class="s">DefaultAgentExecutor 负责默认运行；整体替换执行器时，用户接管相应协调责任。</text>
  <rect x="52" y="858" width="645" height="116" rx="14" fill="white" stroke="#cbd8e4"/>
  <text x="80" y="900" class="b">共同设施</text>
  <text x="80" y="933" class="s">EasyLLM · History · MetaMessage · Hooks / Events</text>
  <text x="80" y="963" class="s">Permission · 当前运行与会话作用域</text>
  <rect x="743" y="858" width="645" height="116" rx="14" fill="white" stroke="#cbd8e4" stroke-dasharray="7 5"/>
  <text x="771" y="900" class="b">按需扩展能力</text>
  <text x="771" y="933" class="s">Skill · MCP · 子 Agent · Task · CodeIntel / Worktree</text>
  <text x="771" y="963" class="s">通过工具、消息与相关运行接口协作</text>
  <text x="52" y="1025" class="s">图示为职责关系，不是每轮调用清单。功能按需安装；保存/恢复显式发起；OS 级隔离需外部设施。</text>
</svg>
